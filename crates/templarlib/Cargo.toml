[package]
name = "templarlib"
version = "0.2.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/0xB4LdW1n/templarlib"
publish = false
edition = "2021"

[dependencies]
templar-core = { path = "../templar-core", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs-next = "2.0"
fs2 = "0.4"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
bdk = { version = "0.30", features = ["all-keys"] }
lwk_wollet = { version = "0.20", default-features = false, features = ["esplora", "electrum", "elements_rpc", "amp2"] }
hex = "0.4"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# The host-embedding walkthrough of docs/INTEGRATION.md. It lives at the
# repository root so it reads as the library's example, not this crate's;
# `cargo build --workspace --examples` (CI) builds it.
[[example]]
name = "embed"
path = "../../examples/embed.rs"

[features]
default = ["hardware", "protocol"]
# The Templar Protocol connector methods: `get_protocol_escrow_xpub`,
# `protocol_check_pset`, `protocol_is_check_pset` (docs/CONNECTOR.md).
protocol = ["templar-core/protocol"]
hardware = ["templar-core/hardware"]
