# cargo-deny configuration: `cargo deny check` runs in CI (.github/workflows/ci.yml).

[graph]
all-features = true

[advisories]
version = 2
# Unmaintained crates fail the check only when this workspace depends on them
# directly; transitive ones are the upstream crates' call.
unmaintained = "workspace"
# Advisories against the old TLS stack that BDK 0.30 pins through its
# Electrum client (electrum-client 0.18 -> rustls 0.21, webpki 0.22,
# webpki-roots 0.22). None has a fixed release on that line: they go away
# only with a BDK upgrade, which is tracked in SECURITY.md. The modern stack
# reqwest and LWK's Electrum client use (rustls 0.23, rustls-webpki 0.103,
# webpki-roots 1.x) is kept on fixed versions by Cargo.lock. Remove an entry
# as soon as its crate leaves the graph.
ignore = [
    { id = "RUSTSEC-2026-0346", reason = "rustls 0.21 via bdk 0.30 -> electrum-client 0.18; no fix on that line" },
    { id = "RUSTSEC-2026-0349", reason = "rustls 0.21 via bdk 0.30 -> electrum-client 0.18; no fix on that line" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.101 via bdk 0.30 -> electrum-client 0.18; no fix on that line" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.101 via bdk 0.30 -> electrum-client 0.18; no fix on that line" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.101 via bdk 0.30 -> electrum-client 0.18; no fix on that line" },
    { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.101 via bdk 0.30 -> electrum-client 0.18; no fix on that line" },
    { id = "RUSTSEC-2026-0381", reason = "webpki-roots 0.22 via bdk 0.30 -> electrum-client 0.18; fixed only in 1.x" },
    { id = "RUSTSEC-2021-0127", reason = "serde_cbor is unmaintained; used only for Jade's CBOR dialect behind the `hardware` feature" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licences only, plus MPL-2.0 (file-level copyleft: fine to link,
# its own files stay MPL). Anything else needs a decision before it lands.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "BlueOak-1.0.0",
    "CDLA-Permissive-2.0",
    "MITNFA",
]

# webpki 0.22 (pinned by bdk 0.30's Electrum client) ships no `license` field;
# its LICENSE file is the ISC text with a preamble.
[[licenses.clarify]]
crate = "webpki"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
